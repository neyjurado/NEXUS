<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameZone - Tienda de Videojuegos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>🎮 NEY TIENDA </h1>
        <nav>
            <ul>
                <li><a href="#">Inicio</a></li>
                <li><a href="#">Juegos</a></li>
                <li><a href="#">Ofertas</a></li>
                <li><a href="#">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <section class="banner">
        <h2>Bienvenido a GameZone</h2>
        <p>Tu tienda favorita de videojuegos al mejor precio</p>
        <button>Ver catálogo</button>
    </section>

    <main>
        <h2>Nuestros Juegos Destacados</h2>
        <div class="productos">
            <div class="producto">
                <img src="https://via.placeholder.com/200x200.png?text=FIFA+25" alt="FIFA 25">
                <h3>FIFA 25</h3>
                <p>$59.99</p>
                <button>Agregar al carrito</button>
            </div>
            <div class="producto">
                <img src="https://via.placeholder.com/200x200.png?text=GTA+VI" alt="GTA VI">
                <h3>GTA VI</h3>
                <p>$69.99</p>
                <button>Agregar al carrito</button>
            </div>
            <div class="producto">
                <img src="https://via.placeholder.com/200x200.png?text=Mario+Odyssey" alt="Mario Odyssey">
                <h3>Super Mario Odyssey</h3>
                <p>$49.99</p>
                <button>Agregar al carrito</button>
            </div>
        </div>
    </main>

    <footer>
        <p>© 2025 GameZone - Todos los derechos reservados</p>
    </footer>
</body>
</html>
